name: Build Plugin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r package.zip index.js index.css plugin.json i18n/ assets/ || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: package.zip
